<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom Occupancy Detection</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            font-weight: 600;
            margin-bottom: 1rem;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            border: 2px solid #333;
        }
        #count {
            margin-top: 1rem;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <h1>Live Classroom Occupancy</h1>
    <img src="{{ url_for('video_feed') }}" alt="Live detection feed">
    <div id="count">Loading count...</div>

    <script>
        // Poll the /count endpoint every second and update the text on the page
        setInterval(async () => {
            const res = await fetch("/count");
            const data = await res.json();
            document.getElementById("count").innerText =
                "Students detected: " + data.count;
        }, 1000);
    </script>
</body>
</html>
